name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs node and pnpm at the versions pinned in mise.toml.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.14
          install_args: "node pnpm"
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Packs the tarball without publishing it; prepack builds the package.
      - name: Pack
        run: npm pack --dry-run

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # buf and protoc-gen-es are the generator pinned in mise.toml.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.14
          install_args: "node pnpm buf npm:@bufbuild/protoc-gen-es"
          cache: false

      - name: Generated code is up to date
        run: scripts/check-generated.sh

  integration:
    runs-on: ubuntu-latest
    # Clones the Toshi server, builds it with its own Go toolchain, then runs vitest against it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The integration test clones the server, so a missing variable or secret skips the job instead of failing it.
      - name: Check the server repository and its read credential
        id: credential
        env:
          TOSHI_SERVER_REPOSITORY: ${{ vars.TOSHI_SERVER_REPOSITORY }}
          TOSHI_SERVER_READ_TOKEN: ${{ secrets.TOSHI_SERVER_READ_TOKEN }}
        run: |
          if [ -z "$TOSHI_SERVER_REPOSITORY" ] || [ -z "$TOSHI_SERVER_READ_TOKEN" ]; then
            echo "::notice::Skipped: the variable TOSHI_SERVER_REPOSITORY or the secret TOSHI_SERVER_READ_TOKEN is not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          basic="$(printf 'x-access-token:%s' "$TOSHI_SERVER_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$TOSHI_SERVER_READ_TOKEN"
          echo "::add-mask::$basic"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $basic"
          } >> "$GITHUB_ENV"
          echo "run=true" >> "$GITHUB_OUTPUT"

      # Installs node and pnpm; the script installs the server's own Go toolchain in the clone.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        if: steps.credential.outputs.run == 'true'
        with:
          version: 2026.9.14
          install_args: "node pnpm"
          cache: false

      - name: Run the integration test
        if: steps.credential.outputs.run == 'true'
        env:
          TOSHI_SERVER_REPOSITORY: ${{ vars.TOSHI_SERVER_REPOSITORY }}
        run: scripts/integration.sh
