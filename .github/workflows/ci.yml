name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs node and pnpm at the versions pinned in mise.toml.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.14
          install_args: "--locked node pnpm"
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Packs the tarball without publishing it; prepack builds the package.
      - name: Pack
        run: npm pack --dry-run

      - name: Committed lockfiles are up to date
        run: |
          mise lock
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --exit-code

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # buf is pinned in mise.toml; protoc-gen-es is a package devDependency.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.14
          install_args: "--locked node pnpm buf"
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generated code is up to date
        run: scripts/check-generated.sh
