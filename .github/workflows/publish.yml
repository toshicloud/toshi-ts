name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Provenance needs GitHub's OIDC identity, so this must be GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the tagged commit can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # npm publish cannot be undone, so the tag's form and its place on main
      # are checked before anything is installed or published.
      - name: Check the tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag is on a commit that main does not contain."
            exit 1
          fi

      # Installs node and pnpm at the versions pinned in mise.toml.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.14
          install_args: "--locked node pnpm"
          cache: false

      # Trusted publishing needs npm 11.5.1 or newer; node in mise.toml bundles npm.
      - name: Check the npm version
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # The tag is the only thing that decides the version, so they must agree.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # npm authenticates with the job's OIDC token (trusted publishing), so no
      # token is stored. Provenance is only allowed for a public repository, so
      # the flag is conditional.
      - name: Publish
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          flags=(--access public)
          if [ "$REPO_PRIVATE" = "false" ]; then
            flags+=(--provenance)
          fi
          npm publish "${flags[@]}"

  # Runs only once the package is on npm, so a Release never points at a
  # version that does not exist. If it fails, re-run this job alone.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check no Release exists
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists and is left as it is."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # The install line, then the annotated tag's message. A lightweight tag
      # has no message, so the commit subjects since the previous tag are used.
      - name: Write the notes
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          {
            echo "Install with \`npm install @toshicloud/sdk@${tag#v}\`."
            echo
            if [ "$(git cat-file -t "refs/tags/$tag")" = tag ]; then
              git for-each-ref --format='%(contents)' "refs/tags/$tag"
            else
              prev="$(git describe --tags --abbrev=0 "$tag^")"
              echo "What changed since ${prev#v}:"
              echo
              git log --no-merges --format='- %s' "$prev..$tag"
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
