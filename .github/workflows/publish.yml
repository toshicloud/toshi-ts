name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Provenance needs GitHub's OIDC identity, so this must be GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs node and pnpm at the versions pinned in mise.toml.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.14
          install_args: "node pnpm"
          cache: false

      # Trusted publishing needs npm 11.5.1 or newer; node in mise.toml bundles npm.
      - name: Check the npm version
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # The tag is the only thing that decides the version, so they must agree.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # npm authenticates with the job's OIDC token (trusted publishing), so no
      # token is stored. Provenance is only allowed for a public repository, so
      # the flag is conditional.
      - name: Publish
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          flags=(--access public)
          if [ "$REPO_PRIVATE" = "false" ]; then
            flags+=(--provenance)
          fi
          npm publish "${flags[@]}"
