version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # typescript-eslint has no TypeScript 7 support yet.
      - dependency-name: typescript
        versions: ["7.x"]
